<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Femmes de la Mer — Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<h2 class="sr-only">Prototype site web Femmes de la Mer — vue mobile et desktop avec navigation complète</h2>

<div class="stage">
  <div class="label-row">
    <span style="font-size:12px;color:var(--muted);">Afficher comme :</span>
    <button class="view-btn on" onclick="setView('mobile',this)">
      <i class="ti ti-device-mobile" aria-hidden="true" style="font-size:13px;vertical-align:-2px;margin-right:3px;"></i>Mobile
    </button>
    <button class="view-btn" onclick="setView('desktop',this)">
      <i class="ti ti-device-laptop" aria-hidden="true" style="font-size:13px;vertical-align:-2px;margin-right:3px;"></i>Desktop
    </button>
  </div>

  <!-- Vue Mobile -->
  <div id="mobile-frame" class="phone">
    <div class="phone-bar">
      <div class="phone-dot"></div>
      <div class="phone-url">
        <i class="ti ti-lock" aria-hidden="true"></i>
        femmesdelamer.mr
      </div>
      <div class="phone-dot"></div>
    </div>
    <div class="phone-screen" id="mobile-screen"></div>
  </div>

  <!-- Vue Desktop -->
  <div id="desktop-frame" class="desktop" style="display:none;">
    <div class="desktop-bar">
      <div class="mac-dot" style="background:#E24B4A;"></div>
      <div class="mac-dot" style="background:#EF9F27;margin-left:4px;"></div>
      <div class="mac-dot" style="background:#639922;margin-left:4px;"></div>
      <div class="desktop-url">
        <i class="ti ti-lock" style="font-size:9px;color:var(--muted);" aria-hidden="true"></i>
        femmesdelamer.mr
      </div>
    </div>
    <div id="desktop-screen"></div>
  </div>

  <!-- Toast notification -->
  <div class="toast2" id="toast2">
    <i class="ti ti-check" aria-hidden="true"></i>
    <span id="tmsg2"></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
